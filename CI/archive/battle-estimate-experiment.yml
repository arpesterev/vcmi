          "$RUNNER_TEMP/probe-timeout" 240 cmake --build --preset linux-gcc-test --target vcmitest --parallel 2
          cp out/build/linux-gcc-test/bin/vcmitest out/build/linux-gcc-test/bin/vcmitest-baseline
