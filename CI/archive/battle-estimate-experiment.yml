          ln -s "$GITHUB_WORKSPACE" "$data_parent/vcmi"
          test -f "$data_parent/vcmi/config/filesystem.json"
          printf 'XDG_DATA_DIRS=%s\n' "$data_parent" >> "$GITHUB_ENV"
          printf 'source=%s\nxdg_data_dirs=%s\n' "$GITHUB_WORKSPACE" "$data_parent" > probe-logs/runtime-data-path.txt
      - name: Prefer existing official HTTPS Ubuntu archive
