          import os
          print('PROBE_CPU='+str(min(os.sched_getaffinity(0))))
          PY
          { uname -a; lscpu; gcc-14 --version; cmake --version; } > probe-logs/environment.txt
          sha256sum out/build/linux-gcc-test/bin/vcmitest-{candidate,baseline} > probe-logs/executables.sha256
      - name: Run bounded ABBA comparisons without trace
        timeout-minutes: 30
        working-directory: out/build/linux-gcc-test/bin
        run: |
          for invocation in baseline-1 candidate-1 candidate-2 baseline-2; do
            revision="${invocation%-*}"
            "$RUNNER_TEMP/probe-timeout" 420 taskset --cpu-list "$PROBE_CPU" /usr/bin/time -v -o "$GITHUB_WORKSPACE/probe-logs/$invocation.rss.txt" "./vcmitest-$revision" --gtest_also_run_disabled_tests --gtest_filter='BattleCallerBenchmark.DISABLED_BoundedLatency' --gtest_output=xml:"$GITHUB_WORKSPACE/probe-logs/$invocation.xml" > "$GITHUB_WORKSPACE/probe-logs/$invocation.log" 2>&1
          done
      - name: Reject incomplete measurements and summarize exact samples
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import itertools, json, math, pathlib, re, statistics, xml.etree.ElementTree as ET
          folder = pathlib.Path('probe-logs')
          expected = set(itertools.product(['6','14','28'], ['0','1'], ['1','2'], ['exchange','finder']))
          results = {}
          for invocation in ['baseline-1','candidate-1','candidate-2','baseline-2']:
              root = ET.parse(folder/(invocation+'.xml')).getroot()
              cases = root.findall('.//testcase')
              assert len(cases) == 1 and cases[0].get('name') == 'DISABLED_BoundedLatency'
              assert cases[0].get('status') == 'run' and cases[0].find('skipped') is None and cases[0].find('failure') is None
              lines = (folder/(invocation+'.log')).read_text().splitlines()
              assert not any('TOTAL_CAP' in line or '\tCAPPED' in line for line in lines)
              config = 'BENCH_CONFIG\tai_level=error\tgmock_verbose=error\ttrace=off'
              assert lines.count(config) == 1
              assert not any(re.search(r'\b(error|fatal)\b|GMOCK WARNING|Unexpected mock', line, re.IGNORECASE) for line in lines if line != config), 'Unexpected diagnostics contaminate benchmark'
              latency = [line.split('\t') for line in lines if line.startswith('LATENCY\t')]
              samples = [line.split('\t') for line in lines if line.startswith('SAMPLE\t')]
              assert len(latency) == 24 and {tuple(row[1:5]) for row in latency} == expected
              assert len(samples) == 24*30
              summary = {}
              for row in latency:
                  key = tuple(row[1:5])
                  assert len(row) == 17 and row[5:7] == ['30','COMPLETE']
                  assert int(row[7]) > 0 and int(row[8]) > 0
                  assert row[15:17] == ['allocations=unmeasured','obstacle_entries=0']
                  signature = row[14].removeprefix('signature=').split(',')
                  assert row[14].startswith('signature=') and len(signature) == 3 and math.isfinite(float(signature[2]))
                  assert all(math.isfinite(float(x)) and float(x) >= 0 for x in row[9:14])
                  matching = [sample for sample in samples if tuple(sample[1:5]) == key]
                  assert len(matching) == 30 and {int(sample[5]) for sample in matching} == set(range(30))
                  assert all(len(sample) == 10 and all(math.isfinite(float(x)) and float(x) >= 0 for x in sample[6:10]) for sample in matching)
                  durations = sorted(float(sample[6]) for sample in matching)
                  summary['/'.join(key)] = dict(samples=30, median_ms=statistics.median(durations), p95_ms=durations[28], stdev_ms=statistics.stdev(durations), candidates=int(row[7]), populated_pairs=int(row[8]), signature=row[14], allocations='unmeasured', obstacle_entries=0)
              results[invocation] = summary
          comparisons = {}
          for key in results['baseline-1']:
              for revision in ['baseline','candidate']:
                  first, second = results[revision+'-1'][key], results[revision+'-2'][key]
                  assert first['signature'] == second['signature'] and first['candidates'] == second['candidates'] and first['populated_pairs'] == second['populated_pairs']
              baseline = statistics.mean(results[v][key]['median_ms'] for v in ['baseline-1','baseline-2'])
              candidate = statistics.mean(results[v][key]['median_ms'] for v in ['candidate-1','candidate-2'])
              baseline_p95 = statistics.mean(results[v][key]['p95_ms'] for v in ['baseline-1','baseline-2'])
              candidate_p95 = statistics.mean(results[v][key]['p95_ms'] for v in ['candidate-1','candidate-2'])
              comparisons[key] = {'baseline_median_ms':baseline, 'candidate_median_ms':candidate, 'median_ratio':candidate/baseline if baseline > 0 else None, 'baseline_p95_ms':baseline_p95, 'candidate_p95_ms':candidate_p95, 'p95_ratio':candidate_p95/baseline_p95 if baseline_p95 > 0 else None}
          output = {'status':'COMPLETE', 'cells_per_invocation':24, 'samples_per_cell':30, 'execution_order':['baseline-1','candidate-1','candidate-2','baseline-2'], 'runs':results, 'comparisons':comparisons, 'interpretation':'Measurement completeness only; no automatic performance acceptance or merge.'}
          (folder/'performance-summary.json').write_text(json.dumps(output, indent=2, allow_nan=False)+'\n')
          print(json.dumps(output, indent=2, allow_nan=False))
          PY
      - name: Preserve performance evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: battle-performance-${{ github.sha }}
          path: probe-logs/
          retention-days: 7
          if-no-files-found: error
