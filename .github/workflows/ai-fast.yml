name: Fast AI checks

on:
  pull_request:
    branches: [develop, 'feature/ai-event-adapters-20261031']
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: fast-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-adapter-contracts:
    name: AI adapter contracts (ASan and UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure standalone adapter checks
        run: >-
          cmake -S AI/Integration -B out/ai-adapter-contracts
          -DCMAKE_BUILD_TYPE=Debug -DAI_ADAPTER_SANITIZERS=ON
      - name: Compile adapter and source tactical checks
        run: cmake --build out/ai-adapter-contracts --parallel 2
      - name: Run protocol, source tactical and evidence-checker tests
        run: ctest --test-dir out/ai-adapter-contracts --output-on-failure

  ai-linux:
    name: Linux AI regression and launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      native_battles: ${{ steps.native_battles.outputs.diagnostics }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare APT staging directory
        run: mkdir -p "$RUNNER_TEMP/apt-cache"

      - name: Restore Linux dependencies
        id: aptcache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apt-cache
          key: gcc-latest-release-apt-ubuntu-24.04

      - name: Install Linux build dependencies
        run: source CI/before_install/linux_qt6.sh

      # Shared compiler-object cache. No releases or third-party uploads.
      - name: Install local compiler cache
        run: sudo apt-get install -y --no-install-recommends ccache

      - name: Restore previously compiled C++ objects
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: vcmi-ai-ubuntu2404-gcc14-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcmi-ai-ubuntu2404-gcc14-v1-

      - name: Configure local compiler cache limit
        run: |
          ccache --max-size=2G
          ccache --show-config | grep -E 'max_size|compression|base_dir|compiler_check'

      - name: Install public Heroes III regression data
        run: |
          wget --progress=dot:giga \
            https://github.com/vcmi-mods/vcmi-test-data/releases/download/v2.0/heroes3.7z \
            -O heroes3.7z
          mkdir -p "$HOME/.local/share/vcmi/"
          7za x -o"$HOME/.local/share/vcmi/" heroes3.7z

      - name: Configure tests
        run: >-
          cmake -DENABLE_CCACHE:BOOL=ON
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          --preset linux-gcc-test

      - name: Show restored compiler cache statistics
        run: ccache --show-stats

      - name: Build reusable engine and server objects
        id: build_core
        run: >-
          /usr/bin/time -f 'Core stage elapsed: %e seconds'
          cmake --build --preset linux-gcc-test --target vcmiMain vcmiservercommon --parallel 3

      - name: Build native tests, headless server and settings launcher
        run: >-
          /usr/bin/time -f 'AI and launcher stage elapsed: %e seconds'
          cmake --build --preset linux-gcc-test --target vcmitest vcmiserver vcmilauncher --parallel 3

      - name: Report compiler cache efficiency
        if: always()
        run: ccache --show-stats || true

      - name: Preserve compiler progress for trusted PR reruns
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.build_core.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: vcmi-ai-ubuntu2404-gcc14-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run source-port battles through the real engine
        id: native_battles
        run: |
          cd out/build/linux-gcc-test/bin
          ./vcmitest --gtest_filter='AIIntegrationNativeBattle.*' --gtest_list_tests > native-port-names.txt
          grep -q '^AIIntegrationNativeBattle\.' native-port-names.txt
          status=0
          timeout 180 ./vcmitest --gtest_filter='AIIntegrationNativeBattle.*' \
            --gtest_output=xml:native-port-battles.xml > "$RUNNER_TEMP/native-battles.log" 2>&1 || status=$?
          tail -n 120 "$RUNNER_TEMP/native-battles.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = {}
          xml = Path('native-port-battles.xml')
          if xml.exists():
              root = ET.parse(xml).getroot()
              report['totals'] = root.attrib
              report['failures'] = [dict(test=case.get('classname', '') + '.' + case.get('name', ''),
                  errors=[(failure.text or '')[:14000] for failure in case.findall('failure')])
                  for case in root.iter('testcase') if case.findall('failure')][:3]
          else:
              report['error'] = 'No native battle XML report was produced'
              report['tail'] = (Path(os.environ['RUNNER_TEMP']) / 'native-battles.log').read_text(errors='replace').splitlines()[-30:]
          for failure in report.get('failures', []):
              print('NATIVE_BATTLE_FAILURE:', failure['test'])
              for error in failure['errors']:
                  print(error)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('diagnostics=' + json.dumps(report, separators=(',', ':')) + '\n')
          PY
          exit "$status"

      - name: Check seeded three-policy battle comparison evidence
        run: |
          python3 - <<'PY'
          import itertools
          import os
          from pathlib import Path

          names = {
              "HoMM3": "HoMM3OriginalTactics",
              "FHeroes2": "FHeroes2Tactics",
              "TUM": "TUMEnchantedTactics",
          }
          seeds = (1337, 2027, 2029)
          pairs = list(itertools.permutations(names, 2))
          expected = {
              f"seed{seed}{a}Against{b}": (str(seed), names[a], names[b])
              for seed in seeds for a, b in pairs
          }
          recorded = {}
          active_case = None
          log_path = Path(os.environ["RUNNER_TEMP"]) / "native-battles.log"
          for line in log_path.read_text(errors="replace").splitlines():
              if line.startswith("[ RUN      ] AIIntegrationNativeBattle."):
                  active_case = line.rsplit(".", 1)[-1].strip()
              elif line.startswith("AI_NATIVE_BATTLE_RESULT ") and active_case in expected:
                  fields = dict(fragment.split("=", 1) for fragment in line.split()[1:] if "=" in fragment)
                  expected_identity = expected[active_case]
                  actual_identity = (fields.get("seed"), fields.get("backend"), fields.get("defender_backend"))
                  if actual_identity != expected_identity:
                      raise SystemExit(f"Policy/seed identity mismatch for {active_case}: {actual_identity}")
                  for metric in ("attacker_decisions", "defender_decisions", "damage"):
                      if int(fields.get(metric, "0")) <= 0:
                          raise SystemExit(f"Missing actual engine activity for {active_case}: {metric}")
                  if fields.get("winner") not in ("attacker", "defender"):
                      raise SystemExit(f"No native winner for {active_case}")
                  if active_case in recorded:
                      raise SystemExit(f"Duplicate native outcome for {active_case}")
                  recorded[active_case] = fields

          missing = sorted(set(expected) - set(recorded))
          if missing:
              raise SystemExit("Missing engine-backed seeded matchup evidence: " + ", ".join(missing))
          print("AI_SOURCE_POLICY_SEEDED_MATRIX seeds=1337,2027,2029 fixture=grand_elf25_vs_dwarves25x2 trials=18")
          for a, b in pairs:
              samples = [recorded[f"seed{seed}{a}Against{b}"] for seed in seeds]
              wins = sum(sample["winner"] == "attacker" for sample in samples)
              damage = sum(int(sample["damage"]) for sample in samples)
              attacks = sum(int(sample["attacker_decisions"]) for sample in samples)
              defenses = sum(int(sample["defender_decisions"]) for sample in samples)
              print(f"AI_SOURCE_POLICY_MATCHUP attacker={names[a]} defender={names[b]} "
                    f"wins_attacker={wins}/3 accepted_activations={attacks}/{defenses} "
                    f"total_engine_damage={damage} samples=3 statistical_claim=false")
          PY

      - name: Run all Nullkiller2 regressions in one process
        run: |
          cd out/build/linux-gcc-test/bin
          ./vcmitest --gtest_filter='Nullkiller2_*:ResourceTradingTurnTest.*' --gtest_list_tests > ai-test-names.txt
          grep -q '^Nullkiller2_' ai-test-names.txt
          timeout 900 ./vcmitest --gtest_filter='Nullkiller2_*:ResourceTradingTurnTest.*' \
            --gtest_output=xml:fast-ai-tests.xml

      - name: Check headless server startup
        run: |
          cd out/build/linux-gcc-test/bin
          ./vcmiserver --dummy-run 2>server-errors.log
          if test -s server-errors.log; then
            cat server-errors.log
            exit 1
          fi

      # A malformed ONNX head must not become a seemingly legal model action.
      # These contracts run without neural weights, independently of the
      # official-model native battle gate below.
      - name: Check V13/V15 MMAI ONNX output safety contracts
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/mmai-') }}
        run: |
          set -euo pipefail
          cd out/build/linux-gcc-test/bin
          timeout 60 ./vcmitest \
            --gtest_filter='MMAINNOutputValidation.*' \
            --gtest_output=xml:mmai-onnx-output-contracts.xml
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          cases = list(ET.parse('mmai-onnx-output-contracts.xml').getroot().iter('testcase'))
          expected = {'RejectsInvalidOnnxOutputBeforeGreedyOrSampling',
                      'V13V15RejectInvalidSamplingTemperatureAtModelConstruction',
                      'V15AcceptsOnlyScalarOrSingletonOnnxOutputs',
                      'V15RejectsInvalidValueHead',
                      'V15RejectsUnrepresentableNeuralActionIdBeforeDispatch',
                      'V13V15WarMachineTargetsOnlyLivingShootableEnemies',
                      'V13V15RejectNonFiniteObservationBeforeInference',
                      'V13V15RejectInvalidTensorElementCountsBeforeOnnxAllocation',
                      'V13V15RejectMovedOrReplacedObservedActorBeforeDispatch',
                      'RejectsScriptedFallbackForStrictOrInvalidActiveActor',
                      'V13RejectsDeadOrMissingEngineOwnedMachineActor',
                      'V13RejectsStaleOrDeadActiveCreatureBeforeModelDispatch',
                      'V13RejectsIllegalTargetBeforeEngineDispatch',
                      'V13RejectsReplacedShootHexTargetBeforeDispatch',
                      'V13RejectsReplacedMeleeHexTargetBeforeDispatch',
                      'V13StrictNeuralRetreatUsesLiveEnginePermission',
                      'V13StrictRejectsInvalidModelActionWithoutResampling',
                      'V13RejectsMoveOutsideLiveEngineReachability',
                      'V13RejectsMeleeApproachOutsideLiveEngineReachability',
                      'V15RejectsStaleActiveCreatureBeforeActionConversion',
                      'V15RejectsEmptyActionGraphBeforeOnnxInference',
                      'V15RejectsInactiveGraphActionBeforeServerDispatch',
                      'V15RejectsMoveOutsideLiveEngineReachability',
                      'V15RejectsMeleeApproachOutsideLiveEngineReachability',
                      'V15RejectsDeadOrMissingModelAttackTarget',
                      'V15RejectsMovedOrReplacedObservedTargetBeforeDispatch',
                      'RejectsUnexpectedTerminalOnnxAction',
                      'StrictNeuralRejectsRepeatedAnsiRenderRequests',
                      'PreservesFiniteOnnxActionDistribution',
                      'V13SamplesOnlyRequiredHierarchicalHeads',
                      'V13RejectsInvalidRequiredHead',
                      'V13RejectsJaggedActionTableMetadata',
                      'V13RejectsIncorrectOnnxInputAndOutputNamesAtLoad',
                      'V13V15RejectMalformedOnnxTensorSignaturesAtLoad',
                      'V13RejectsOutOfRangeActionTableEntries',
                      'V13RejectsDecodedActionOutsideLiveSchema',
                      'V15RejectsDuplicateNodeAndEdgeMetadataTypes',
                      'RejectsInvalidModelSideMetadata',
                      'RejectsInvalidModelVersionMetadata',
                      'StrictRejectsConfiguredNeuralLoadError',
                      'StrictLiveBattleRejectsGymResetButAllowsGraphActionZero',
                      'LegacyFallbackCannotPoisonStrictModelCache'}
          if {c.get('name') for c in cases} != expected or len(cases) != len(expected):
              raise RuntimeError('MMAI ONNX output contract tests missing: ' + str(cases))
          if any(c.find(t) is not None for c in cases for t in ('failure', 'error', 'skipped')):
              raise RuntimeError('MMAI ONNX output contract test failed or skipped')
          print('Verified: V13/V15 shared neural output guards reject invalid weights and preserve finite heads')
          PY

      # Only MMAI or four-policy integration PRs download checksum-pinned 1.8 ONNX weights; no
      # binary weights enter this repository, Actions artifacts or release jobs.
      - name: Install verified public MMAI neural pack into isolated CI preset
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/mmai-') || startsWith(github.head_ref, 'feature/ai-four-policy-integration-')) }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/vcmi-mods/mmai/releases/download/vcmi-1.8-latest/mod.zip' \
            --output "$RUNNER_TEMP/mmai-mod.zip"
          echo "25c997888015386c59c74a426cd0368b5035048dd61b059854d5b7689acdb7d4  $RUNNER_TEMP/mmai-mod.zip" | sha256sum -c -
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.home() / '.local/share/vcmi'
          archive = Path(os.environ['RUNNER_TEMP']) / 'mmai-mod.zip'
          with ZipFile(archive) as z:
              for name in z.namelist():
                  parts = PurePosixPath(name).parts
                  if not parts or parts[0].lower() != 'mmai' or '..' in parts:
                      raise ValueError('Unexpected path in MMAI release: ' + name)
              z.extractall(root / 'Mods')

          mod = root / 'Mods/mmai'
          manifest_file = mod / 'mod.json'
          if not manifest_file.exists():
              raise RuntimeError('MMAI mod.json is missing from downloaded release')
          # Use the official 1.8 release with its unmodified compatibility
          # declaration. The release asset SHA-256 is pinned above.
          manifest = json.loads(manifest_file.read_text())
          compat = manifest.get('compatibility', {})
          if compat.get('min') != '1.8.0' or compat.get('max') != '1.8.9':
              raise RuntimeError('Unexpected MMAI 1.8 release compatibility: ' + str(compat))
          print('Verified native MMAI compatibility:', compat)
          settings_file = mod / 'config/mmai-settings.json'
          model_settings = json.loads(settings_file.read_text())
          if not {'attacker', 'defender'}.issubset(model_settings.get('models', {})):
              raise RuntimeError('MMAI release must configure attacker and defender models')
          for role, filename in model_settings['models'].items():
              candidate = mod / 'models' / filename
              if not candidate.is_file():
                  alt = mod / 'models' / filename.replace('.onnx', '-stochastic.onnx')
                  if not alt.is_file():
                      raise RuntimeError('No published model for ' + role + ': ' + filename)
                  model_settings['models'][role] = alt.name
                  candidate = alt
              print('MMAI neural model:', role, candidate.name, candidate.stat().st_size)
          settings_file.write_text(json.dumps(model_settings, indent=2) + '\n')

          # CVcmiTestConfig always uses the separate testModSettings preset,
          # never the end user's launcher modSettings.json.
          preset_file = Path.home() / '.config/vcmi/testModSettings.json'
          preset_file.parent.mkdir(parents=True, exist_ok=True)
          preset = json.loads(preset_file.read_text()) if preset_file.exists() else {}
          preset_name = preset.get('activePreset', 'default')
          preset['activePreset'] = preset_name
          active = preset.setdefault('presets', {}).setdefault(preset_name, {}).setdefault('mods', ['vcmi', 'vcmi-test'])
          if 'mmai' not in active:
              active.append('mmai')
          preset_file.write_text(json.dumps(preset, indent=2) + '\n')
          print('CI-only test mod preset:', active)
          PY

      - name: Run real MMAI neural actions through VCMI battle engine
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/mmai-') || startsWith(github.head_ref, 'feature/ai-four-policy-integration-')) }}
        run: |
          set -euo pipefail
          cd out/build/linux-gcc-test/bin
          ulimit -c 0
          result=0
          VCMI_AI_MMAI_NEURAL_TEST=1 timeout 300 ./vcmitest \
            --gtest_filter='AIIntegrationNativeBattle.mmai*RealBattle:AIIntegrationNativeBattle.mmaiOppositeSideMetadataIsRejected' \
            --gtest_output=xml:mmai-real-neural-battle.xml || result=$?
          if [[ "$result" == 139 ]]; then
            # A real-model crash is a hard test failure. Record a stack
            # without uploading a memory dump or publishing model weights.
            sudo apt-get install -y --no-install-recommends gdb
            VCMI_AI_MMAI_NEURAL_TEST=1 timeout 180 gdb --quiet --batch \
              -ex 'set pagination off' -ex 'set print thread-events off' \
              -ex run -ex 'bt 35' -ex 'thread apply all bt 8' \
              --args ./vcmitest \
                --gtest_filter='AIIntegrationNativeBattle.mmai*RealBattle:AIIntegrationNativeBattle.mmaiOppositeSideMetadataIsRejected' || true
          fi
          if [[ "$result" != 0 ]]; then
            exit "$result"
          fi
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse('mmai-real-neural-battle.xml').getroot()
          cases = list(root.iter('testcase'))
          expected = {'mmaiFirstAidWithoutWoundsUsesEngineAutoHealRealBattle',
                      'mmaiWithRealNeuralModelCompletesRealBattle',
                      'mmaiDefenderNeuralModelCompletesRealBattle',
                      'mmaiSiegeDefenderNeuralModelCompletesRealBattle',
                      'mmaiBothNeuralSidesFightRealBattle',
                      'mmaiOppositeSideMetadataIsRejected',
                      'mmaiSiegeAttackerAgainstTUMDefenderRealBattle',
                      'mmaiAttackerAgainstHoMM3DefenderRealBattle',
                      'mmaiDefenderAgainstHoMM3AttackerRealBattle',
                      'mmaiAttackerAgainstTUMDefenderRealBattle',
                      'mmaiDefenderAgainstTUMAttackerRealBattle',
                      'mmaiStrictNeuralDoesNotCastScriptedHeroSpellRealBattle',
                      'mmaiRangedAttackerAgainstFHeroes2InfantryRealBattle',
                      'mmaiDefenderAgainstFHeroes2RangedAttackerRealBattle'}
          names = {case.get('name') for case in cases}
          if len(cases) != 14 or names != expected:
              raise RuntimeError('MMAI attacker, defender and siege neural battles did not all execute: ' + str(names))
          if any(case.find(tag) is not None for case in cases for tag in ('failure', 'error', 'skipped')):
              raise RuntimeError('An MMAI neural integration test failed or was skipped')
          print('Verified: thirteen model-gated MMAI battle cases (including engine-owned first aid) plus one negative ONNX side check; war machines are not neural commands')
          PY

      - name: Save compiled C++ objects for later develop builds
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: vcmi-ai-ubuntu2404-gcc14-v1-${{ github.run_id }}-${{ github.run_attempt }}

  native-battle-summary:
    name: Native battle evidence
    needs: ai-linux
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report actual native battle results
        env:
          NATIVE_BATTLES: ${{ needs.ai-linux.outputs.native_battles }}
        run: |
          python3 - <<'PY'
          import json, os
          report = os.environ.get('NATIVE_BATTLES')
          print(json.dumps(json.loads(report), indent=2) if report else 'No report: native build or test setup failed.')
          PY

  validate-code:
    name: Validate Code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Ensure LF line endings
        shell: bash
        run: |
          find . -path ./.git -prune -o -path ./AI/FuzzyLite -prune -o -path ./test/googletest \
            -o -path ./osx -prune -o -type f \
            -not -name '*.png' -and -not -name '*.ttf' -and -not -name '*.wav' \
            -and -not -name '*.webm' -and -not -name '*.ico' -and -not -name '*.bat' \
            -and -not -name '*.cmd' -and -not -name '*.iss' -and -not -name '*.isl' -print0 | \
            { ! xargs -0 grep -l -z -P '\r\n'; }
      - name: Validate JSON
        shell: bash
        run: |
          sudo apt install python3-jstyleson
          python3 CI/validate_json.py
      - name: Validate relative local includes
        run: python3 CI/normalize_relative_includes.py --repo .
      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          config: CI/example.markdownlint-cli2.jsonc
          globs: '**/*.md'
