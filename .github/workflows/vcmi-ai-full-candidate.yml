        timeout-minutes: 68
        run: |
          "$RUNNER_TEMP/probe-timeout" 300 cmake --preset linux-gcc-test -DCMAKE_BUILD_TYPE=Release -DENABLE_BATTLE_AI=ON -DENABLE_CCACHE=OFF -DENABLE_NULLKILLER2_AI=ON -DENABLE_STATIC_LIBS=ON -DVCMI_BATTLE_AI_CALLER_PROBES=ON -DVCMI_BATTLE_AI_TEST_TRACE=OFF -DVCMI_BATTLE_AI_BENCHMARK_ONLY=ON -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          "$RUNNER_TEMP/probe-timeout" 3720 cmake --build --preset linux-gcc-test --target vcmitest --parallel 2
