          assert all(line.split() == ['URIs:', 'mirror+file:/etc/apt/apt-mirrors.txt'] for line in uri_fields)
          signed_by = [line for line in text.splitlines() if line.startswith('Signed-By:')]
          assert len(signed_by) == len(uri_fields)
          assert all(line.split() == ['Signed-By:', str(keyring)] for line in signed_by)
          expected = ('http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n'
