          mirrors.write_text(updated)
          assert mirrors.read_text() == updated
          assert source.read_bytes() == original_source and keyring.read_bytes() == original_keyring
          report = {'replaced_uri_count':1, 'mirror_entries':3, 'source_uri_fields':len(uri_fields), 'old_uri':old, 'new_uri':new, 'sources_sha256_unchanged':hashlib.sha256(original_source).hexdigest(), 'keyring_sha256_unchanged':hashlib.sha256(original_keyring).hexdigest(), 'mirror_before_sha256':hashlib.sha256(original.encode()).hexdigest(), 'mirror_after_sha256':hashlib.sha256(updated.encode()).hexdigest(), 'signature_checks':'unchanged; no trust or authentication bypass'}
          pathlib.Path('probe-logs/ubuntu-mirror-change.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, indent=2))
