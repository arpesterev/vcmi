      - name: Build pinned 1.7.5 full BattleAI production baseline
        timeout-minutes: 20
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          manifest = json.loads(pathlib.Path('CI/ai-full-battle-baseline.json').read_text())
          assert manifest['base_commit'] == os.environ['VCMI_BASE']
          paths = manifest['production_files']
          assert paths and len(paths) == len(set(paths))
          # All changed runtime BattleAI source/header files must be named, not only the estimator.
          changed = subprocess.check_output(['git','diff','--name-only',os.environ['VCMI_BASE'],os.environ['GITHUB_SHA'],'--','AI/BattleAI'], text=True).splitlines()
          actual = {p for p in changed if p.endswith(('.cpp','.h')) and p != 'AI/BattleAI/BattleAITestTrace.h'}
          assert actual == set(paths), (actual, set(paths))
          evidence = {'scope': manifest['scope'], 'base_commit': os.environ['VCMI_BASE'], 'candidate_commit': os.environ['GITHUB_SHA'], 'files': []}
          for name in paths:
              path = pathlib.Path(name)
              candidate = path.read_bytes()
              baseline = subprocess.check_output(['git','show',os.environ['VCMI_BASE']+':'+name])
              evidence['files'].append({'path': name, 'candidate_sha256': hashlib.sha256(candidate).hexdigest(), 'baseline_sha256': hashlib.sha256(baseline).hexdigest()})
              path.write_bytes(baseline)
          pathlib.Path('probe-logs/full-battle-baseline-manifest.json').write_text(json.dumps(evidence, indent=2)+'\n')
          PY
          "$RUNNER_TEMP/probe-timeout" 1080 cmake --build --preset linux-gcc-test --target vcmitest --parallel 2
          cp out/build/linux-gcc-test/bin/vcmitest out/build/linux-gcc-test/bin/vcmitest-baseline
          git restore --source="$GITHUB_SHA" --worktree -- AI/BattleAI
      - name: Record same-runner environment and executable hashes
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          print('PROBE_CPU='+str(min(os.sched_getaffinity(0))))
          PY
          { uname -a; lscpu; gcc-14 --version; cmake --version; } > probe-logs/environment.txt
          sha256sum out/build/linux-gcc-test/bin/vcmitest-{candidate,baseline} > probe-logs/executables.sha256
      - name: Require bounded real spell search for both revisions
        timeout-minutes: 14
        working-directory: out/build/linux-gcc-test/bin
        run: |
          set -euo pipefail
          for revision in baseline candidate; do
            "$RUNNER_TEMP/probe-timeout" 360 /usr/bin/time -f 'MAX_RSS_KB=%M\nELAPSED_SECONDS=%e' -o "$GITHUB_WORKSPACE/probe-logs/spell-search-$revision.resources.txt" taskset -c "$PROBE_CPU" "./vcmitest-$revision" --gtest_also_run_disabled_tests --gtest_filter='BattleSpellSearchBenchmark.DISABLED_BoundedRealSpellSearch' --gtest_output=xml:"$GITHUB_WORKSPACE/probe-logs/spell-search-$revision.xml" > "$GITHUB_WORKSPACE/probe-logs/spell-search-$revision.log" 2>&1
            python3 "$GITHUB_WORKSPACE/CI/validate_spell_search.py" --revision "$revision" --log "$GITHUB_WORKSPACE/probe-logs/spell-search-$revision.log" --xml "$GITHUB_WORKSPACE/probe-logs/spell-search-$revision.xml" --output "$GITHUB_WORKSPACE/probe-logs/spell-search-$revision.json"
          done
      - name: Run bounded ABBA comparisons without trace
        timeout-minutes: 30
        working-directory: out/build/linux-gcc-test/bin
        run: |
          for invocation in baseline-1 candidate-1 candidate-2 baseline-2; do
            revision="${invocation%-*}"
            "$RUNNER_TEMP/probe-timeout" 420 taskset --cpu-list "$PROBE_CPU" /usr/bin/time -v -o "$GITHUB_WORKSPACE/probe-logs/$invocation.rss.txt" "./vcmitest-$revision" --gtest_also_run_disabled_tests --gtest_filter='BattleCallerBenchmark.DISABLED_BoundedLatency' --gtest_output=xml:"$GITHUB_WORKSPACE/probe-logs/$invocation.xml" > "$GITHUB_WORKSPACE/probe-logs/$invocation.log" 2>&1
          done
      - name: Reject incomplete measurements and summarize exact samples
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import itertools, json, math, pathlib, re, statistics, xml.etree.ElementTree as ET
          folder = pathlib.Path('probe-logs')
          expected = set(itertools.product(['6','14','28'], ['0','1'], ['1','2'], ['exchange','finder']))
          results = {}
          for invocation in ['baseline-1','candidate-1','candidate-2','baseline-2']:
              root = ET.parse(folder/(invocation+'.xml')).getroot()
              cases = root.findall('.//testcase')
              assert len(cases) == 1 and cases[0].get('name') == 'DISABLED_BoundedLatency'
              assert cases[0].get('status') == 'run' and cases[0].find('skipped') is None and cases[0].find('failure') is None
              lines = (folder/(invocation+'.log')).read_text().splitlines()
              assert not any('TOTAL_CAP' in line or '\tCAPPED' in line for line in lines)
              config = 'BENCH_CONFIG\tai_level=error\tgmock_verbose=error\ttrace=off'
              assert lines.count(config) == 1
              assert not any(re.search(r'\b(error|fatal)\b|GMOCK WARNING|Unexpected mock', line, re.IGNORECASE) for line in lines if line != config), 'Unexpected diagnostics contaminate benchmark'
              latency = [line.split('\t') for line in lines if line.startswith('LATENCY\t')]
              samples = [line.split('\t') for line in lines if line.startswith('SAMPLE\t')]
              assert len(latency) == 24 and {tuple(row[1:5]) for row in latency} == expected
              assert len(samples) == 24*30
              summary = {}
              for row in latency:
                  key = tuple(row[1:5])
                  assert len(row) == 17 and row[5:7] == ['30','COMPLETE']
                  assert int(row[7]) > 0 and int(row[8]) > 0
                  assert row[15:17] == ['allocations=unmeasured','obstacle_entries=0']
                  signature = row[14].removeprefix('signature=').split(',')
                  assert row[14].startswith('signature=') and len(signature) == 3 and math.isfinite(float(signature[2]))
                  assert all(math.isfinite(float(x)) and float(x) >= 0 for x in row[9:14])
                  matching = [sample for sample in samples if tuple(sample[1:5]) == key]
                  assert len(matching) == 30 and {int(sample[5]) for sample in matching} == set(range(30))
                  assert all(len(sample) == 10 and all(math.isfinite(float(x)) and float(x) >= 0 for x in sample[6:10]) for sample in matching)
                  durations = sorted(float(sample[6]) for sample in matching)
                  summary['/'.join(key)] = dict(samples=30, median_ms=statistics.median(durations), p95_ms=durations[28], stdev_ms=statistics.stdev(durations), candidates=int(row[7]), populated_pairs=int(row[8]), signature=row[14], allocations='unmeasured', obstacle_entries=0)
              results[invocation] = summary
          comparisons = {}
          for key in results['baseline-1']:
              for revision in ['baseline','candidate']:
                  first, second = results[revision+'-1'][key], results[revision+'-2'][key]
                  assert first['signature'] == second['signature'] and first['candidates'] == second['candidates'] and first['populated_pairs'] == second['populated_pairs']
              baseline = statistics.mean(results[v][key]['median_ms'] for v in ['baseline-1','baseline-2'])
              candidate = statistics.mean(results[v][key]['median_ms'] for v in ['candidate-1','candidate-2'])
              baseline_p95 = statistics.mean(results[v][key]['p95_ms'] for v in ['baseline-1','baseline-2'])
              candidate_p95 = statistics.mean(results[v][key]['p95_ms'] for v in ['candidate-1','candidate-2'])
              comparisons[key] = {'baseline_median_ms':baseline, 'candidate_median_ms':candidate, 'median_ratio':candidate/baseline if baseline > 0 else None, 'baseline_p95_ms':baseline_p95, 'candidate_p95_ms':candidate_p95, 'p95_ratio':candidate_p95/baseline_p95 if baseline_p95 > 0 else None}
          output = {'status':'COMPLETE', 'cells_per_invocation':24, 'samples_per_cell':30, 'execution_order':['baseline-1','candidate-1','candidate-2','baseline-2'], 'runs':results, 'comparisons':comparisons, 'interpretation':'Complete changed BattleAI production bundle versus pinned 1.7.5, identical compatible exchange/finder harness; not full-game latency or win rate. No automatic performance acceptance or merge.'}
          (folder/'performance-summary.json').write_text(json.dumps(output, indent=2, allow_nan=False)+'\n')
          print(json.dumps(output, indent=2, allow_nan=False))
          PY
      - name: Preserve performance evidence
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: battle-performance-${{ github.sha }}
          path: probe-logs/
          retention-days: 7
          if-no-files-found: error


  macos:
    needs: [integration, performance]
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MACOS_CODE_SIGN_IDENTITY: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Require GitHub-hosted runner
        run: test "$RUNNER_ENVIRONMENT" = github-hosted
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Verify architecture, ancestry and toolchain
        run: |
          test "$(uname -m)" = arm64
          test -d "$DEVELOPER_DIR"
          git merge-base --is-ancestor "$VCMI_BASE" HEAD
          git merge-base --is-ancestor "$CANDIDATE_PARENT" HEAD
          test "$(git -C dependencies rev-parse HEAD)" = 2e1924490c80547a8f85ed88aca29223057e832b
          xcodebuild -version
          cmake --version
          ninja --version
      - name: Restore pinned upstream dependencies
        run: |
          pipx install 'conan==2.33.0'
          conan --version
          curl --fail --location --retry 3 https://github.com/vcmi/vcmi-dependencies/releases/download/2026-07-07/dependencies-mac-arm.txz -o "$RUNNER_TEMP/dependencies-mac-arm.txz"
          echo "88c0a27d137ae27cc86da5762d9f50c9080be13380afd2b416de3335a4ac8dd0  $RUNNER_TEMP/dependencies-mac-arm.txz" | shasum -a 256 --check
          conan cache restore "$RUNNER_TEMP/dependencies-mac-arm.txz"
          conan profile detect
          conan install . --output-folder=conan-generated --build=never --profile=dependencies/conan_profiles/macos-arm --profile=dependencies/conan_profiles/base/apple-system --conf="tools.cmake.cmaketoolchain:generator=Ninja"
      - name: Configure candidate
        run: |
          cmake --preset macos-arm-conan-ninja-release -DENABLE_CCACHE=OFF -DENABLE_TEST=OFF -DENABLE_NULLKILLER2_AI=ON -DENABLE_BATTLE_AI=ON -DPACKAGE_FILE_NAME="vcmi-1.7.5-ai-full-candidate-arm64-${GITHUB_SHA:0:12}" -DPACKAGE_NAME_SUFFIX="AI candidate" -DENABLE_GOLDMASTER=OFF
      - name: Build ARM64
        run: |
          set -o pipefail
          cmake --build --preset macos-arm-conan-ninja-release --parallel 2 2>&1 | tee "$RUNNER_TEMP/vcmi-macos-build.log"
      - name: Package app without DMG/XProtect workaround
        working-directory: out/build/macos-arm-conan-ninja-release
        run: |
          cpack -G ZIP -C Release
          package="vcmi-1.7.5-ai-full-candidate-arm64-${GITHUB_SHA:0:12}"
          staged_app="_CPack_Packages/Darwin/ZIP/$package/VCMI.app"
          # vcmibuilder is a script: its signature lives in extended attributes.
          # CPack's ZIP drops those; ditto preserves them for Archive Utility.
          codesign --verify --strict --verbose=2 "$staged_app/Contents/MacOS/vcmibuilder"
          codesign --verify --deep --strict --verbose=2 "$staged_app"
          ditto -c -k --rsrc --extattr --sequesterRsrc --keepParent "$staged_app" "$RUNNER_TEMP/$package.zip"
          mv "$RUNNER_TEMP/$package.zip" "$package.zip"
          shasum -a 256 *.zip > SHA256SUMS.txt
          printf 'Source commit: %s\nBase commit: %s\nARM64 candidate; ad-hoc signed, not Apple-notarized.\n' "$GITHUB_SHA" "$VCMI_BASE" > BUILD-INFO.txt
      - name: Verify extracted ARM64 app and signatures
        working-directory: out/build/macos-arm-conan-ninja-release
        run: |
          verify_dir="$RUNNER_TEMP/vcmi-package-check"
          mkdir -p "$verify_dir"
          ditto -x -k "vcmi-1.7.5-ai-full-candidate-arm64-${GITHUB_SHA:0:12}.zip" "$verify_dir"
          app="$verify_dir/VCMI.app"
          test -f "$app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$app/Contents/MacOS/vcmibuilder"
          codesign --verify --deep --strict --verbose=2 "$app"
          for executable in vcmiclient vcmiserver vcmilauncher vcmieditor; do
            test -x "$app/Contents/MacOS/$executable"
            test "$(lipo -archs "$app/Contents/MacOS/$executable")" = arm64
            codesign --verify --strict --verbose=2 "$app/Contents/MacOS/$executable"
          done
          test -f "$app/Contents/Frameworks/AI/libNullkiller2.dylib"
          test -f "$app/Contents/Frameworks/AI/libBattleAI.dylib"
          while IFS= read -r -d '' library; do
            lipo -verify_arch arm64 "$library"
            codesign --verify --strict --verbose=2 "$library"
          done < <(find "$app/Contents" -type f -name '*.dylib' -print0)
      - name: Preserve matching source and license
        run: |
          mkdir -p source-artifact
          export SOURCE_ARCHIVE_DIR="$GITHUB_WORKSPACE/source-artifact"
          git archive --format=tar HEAD -o "$GITHUB_WORKSPACE/source-artifact/vcmi-source.tar"
          git submodule foreach --recursive 'git archive --format=tar --prefix="$displaypath/" HEAD -o "$SOURCE_ARCHIVE_DIR/submodule-$(echo "$displaypath" | tr / _).tar"'
          cp license.txt source-artifact/
          printf 'Source commit: %s\nBase commit: %s\nExtract vcmi-source.tar, then each submodule archive into the same directory.\n' "$GITHUB_SHA" "$VCMI_BASE" > source-artifact/README.txt
          git submodule status --recursive > source-artifact/SUBMODULES.txt
          (cd source-artifact && shasum -a 256 *.tar > SHA256SUMS.txt)
      - name: Upload matching source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vcmi-175-ai-full-candidate-source-${{ github.sha }}
          path: source-artifact/
          retention-days: 7
          if-no-files-found: error
      - name: Upload candidate binary
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vcmi-175-ai-full-candidate-macos-arm64-${{ github.sha }}
          path: |
            out/build/macos-arm-conan-ninja-release/*.zip
            out/build/macos-arm-conan-ninja-release/SHA256SUMS.txt
            out/build/macos-arm-conan-ninja-release/BUILD-INFO.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Preserve Mac diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vcmi-175-ai-full-macos-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vcmi-macos-build.log
            out/build/macos-arm-conan-ninja-release/CMakeCache.txt
            out/build/macos-arm-conan-ninja-release/CMakeFiles/CMakeConfigureLog.yaml
            out/build/macos-arm-conan-ninja-release/_CPack_Packages/Darwin/ZIP/CPack*log
          retention-days: 7
          if-no-files-found: ignore
