name: Platform Builds (manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - windows
          - macos
          - android
          - ios
      enable_lto:
        description: 'Enable link-time optimization'
        type: boolean
        default: false

permissions:
  contents: read

env:
  VCMI_ENABLE_LTO: ${{ (github.ref == 'refs/heads/master' || inputs.enable_lto) && 'ON' || 'OFF' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  select-platforms:
    name: Select manual build platforms
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        name: Generate selected platform matrix
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: python3 CI/select_ci_platforms.py "$BUILD_PLATFORM" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: select-platforms
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Prepare APT staging dir
      if: contains(matrix.os, 'ubuntu')
      run: mkdir -p "$RUNNER_TEMP/apt-cache"

    - name: APT cache restore
      if: contains(matrix.os, 'ubuntu')
      id: aptcache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/apt-cache
        key: ${{ matrix.platform }}-apt-${{ matrix.os }}
        restore-keys: |
          ${{ matrix.platform }}-apt-${{ matrix.os }}

    - name: Prepare CI
      if: "${{ matrix.before_install != '' }}"
      run: source '${{ github.workspace }}/CI/before_install/${{ matrix.before_install }}'

    - name: Configure codesigning for macOS
      if: ${{ startsWith(matrix.platform, 'mac-') && matrix.pack == 1 }}
      env: 
        KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        SIGNING_CERTIFICATE_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_BASE64 }}
        SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
      run: |
        if [[ -z "$KEYCHAIN_PASSWORD" || -z "$SIGNING_CERTIFICATE_BASE64" || -z "$SIGNING_CERTIFICATE_PASSWORD" ]]; then
          echo "skip codesigning"
          exit 0
        fi

        keychainName=build.keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychainName"
        security default-keychain -s "$keychainName"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychainName"
        security set-keychain-settings -u -t 7200 "$keychainName"

        certPath="$RUNNER_TEMP/cert.p12"
        printf "$SIGNING_CERTIFICATE_BASE64" | base64 -D -o "$certPath"

        security import "$certPath" -f pkcs12 -P "$SIGNING_CERTIFICATE_PASSWORD" -T "$(which codesign)" -k "$keychainName"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychainName" >/dev/null

        # fetch SHA-1 of the p12 cert. Sample output for awk processing:
        # SHA1 Fingerprint=00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33
        signingIdentitySHA=$(openssl pkcs12 -in "$certPath" -nodes -passin "pass:$SIGNING_CERTIFICATE_PASSWORD" -legacy 2>/dev/null \
          | openssl x509 -noout -fingerprint -sha1 \
          | awk -F = '{ gsub(/:/, "", $2); print $2 }')
        echo MACOS_CODE_SIGN_IDENTITY=$signingIdentitySHA >> $GITHUB_ENV

    - name: Detect Visual Studio version (Windows)
      if: ${{ startsWith(matrix.platform, 'msvc') }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsInstallationVersion = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion
        $vsMajor = ($vsInstallationVersion -split '\.')[0]
        echo "MSBUILD_VS_VERSION=$vsMajor" >> $env:GITHUB_ENV

    - name: Install MSVC v142 toolset (Windows non-ARM)
      if: ${{ startsWith(matrix.platform, 'msvc') && matrix.arch != 'arm64' }}
      shell: pwsh
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath

        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        & $installer modify --installPath "$installPath" --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --quiet --norestart

    - name: Install Conan Dependencies
      if: "${{ matrix.conan_prebuilts != '' }}"
      run: |
        pipx install conan
        source '${{github.workspace}}/CI/install_conan_dependencies.sh' '${{matrix.conan_prebuilts}}'

    - name: Setup MSVC Developer Command Prompt
      if: ${{ startsWith(matrix.platform, 'msvc') }}
      uses: step-security/msvc-dev-cmd@main
      with:
        arch: ${{ matrix.arch }}
        toolset: ${{ matrix.toolset }}


    - name: CCache tuning (Android)
      if: ${{ startsWith(matrix.platform, 'android') }}
      run: |
        echo "/usr/lib/ccache" >> $GITHUB_PATH
        ccache --set-config=compiler_check=content
        ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
        ccache --set-config=hash_dir=true
        ccache --set-config=sloppiness=time_macros

    - name: Install Conan profile
      if: "${{ matrix.conan_profile != '' }}"
      run: |
        conan profile detect
        outFolder=conan-generated
        conan install . \
          --output-folder="$outFolder" \
          --build=never \
          --profile=dependencies/conan_profiles/${{ matrix.conan_profile }} \
          --conf="tools.cmake.cmaketoolchain:generator=Ninja" \
          ${{ matrix.conan_options }} \
          ${{ startsWith(matrix.platform, 'msvc') && '--conf="tools.microsoft.msbuild:vs_version=${MSBUILD_VS_VERSION}"' || '' }}

    # MSVC CI builds use Ninja. Qt tools such as moc, uic, and rcc run in the later
    # build step, which does not inherit PATH changes made inside CMake's configure process.
    # Persist the Conan DLL directories for all subsequent GitHub Actions steps.
    - name: Add Conan runtime dependencies to PATH (MSVC)
      if: ${{ startsWith(matrix.platform, 'msvc') }}
      run: sed 's#/[^/]*$##' conan-generated/_runtime_libs.txt | sort -u >> "$GITHUB_PATH"

    # Can't be set in Gradle project
    - name: Configure enableUncompressedNativeLibs
      if: ${{ startsWith(matrix.platform, 'android') }}
      run: mkdir -p ~/.gradle && echo "android.bundle.enableUncompressedNativeLibs=true" > ~/.gradle/gradle.properties

    - name: Install Java
      uses: actions/setup-java@v6
      if: ${{ startsWith(matrix.platform, 'android') }}
      with:
        distribution: 'temurin'
        java-version: '17'

    # Frees 10+GB on linux runners by removing unused tools (.NET, Haskell compiler)
    - name: Free up disk space
      if: contains(matrix.os, 'ubuntu')
      run: |
        echo "Disk usage BEFORE cleanup:"
        df -h
        sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/dotnet || :
        echo "Disk usage AFTER cleanup:"
        df -h

    # a hack to build ID for x64 build in order for Google Play to allow upload of both 32 and 64 bit builds
    - name: Build Number
      run: |
        source '${{github.workspace}}/CI/get_package_name.sh'
        if [ '${{ matrix.artifact_platform }}' ]; then
          VCMI_PACKAGE_FILE_NAME+="-${{ matrix.artifact_platform }}"
        fi
        echo VCMI_PACKAGE_FILE_NAME="$VCMI_PACKAGE_FILE_NAME" >> $GITHUB_ENV
        echo VCMI_PACKAGE_BUILD="$VCMI_PACKAGE_BUILD" >> $GITHUB_ENV
        echo VCMI_PACKAGE_NAME_SUFFIX="$VCMI_PACKAGE_NAME_SUFFIX" >> $GITHUB_ENV
        echo VCMI_PACKAGE_GOLDMASTER="$VCMI_PACKAGE_GOLDMASTER" >> $GITHUB_ENV
      env:
        PULL_REQUEST: ${{ github.event.pull_request.number }}

    - name: Configure (non-MSVC)
      if: ${{ !startsWith(matrix.platform, 'msvc') }}
      run: |
        if [[ ("${{ matrix.preset }}" == "android-conan-ninja-release") && ("${{ github.ref }}" != 'refs/heads/master') ]]; then
          # key1=value1;key2=value2;...
          gradleProperties=$(python3 CI/android/gradle_daily_props.py)
          androidOptions=("-DANDROID_GRADLE_PROPERTIES=$gradleProperties")
          androidOptions+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
        fi
        cmake -DENABLE_CCACHE:BOOL=ON "${androidOptions[@]}" --preset ${{ matrix.preset }}

    - name: Configure (MSVC)
      if: ${{ startsWith(matrix.platform, 'msvc') }}
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{matrix.preset}}
      env:
        ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    - name: Create AppImage
      if: ${{ matrix.platform == 'linux-appimage-x64' || matrix.platform == 'linux-appimage-arm64' }}
      env:
        BUILD_DIR: ${{ github.workspace }}/out/build/${{ matrix.preset }}
        ARCH: ${{ matrix.artifact_platform }}
      run: |
        chmod +x CI/create_appimage.sh
        CI/create_appimage.sh --use-conan

    - name: Kill XProtect to work around CPack issue on macOS
      if: ${{ startsWith(matrix.platform, 'mac') && matrix.pack == 1 }}
      run: |
        # Cf. https://github.com/actions/runner-images/issues/7522#issuecomment-1556766641
        echo Killing...; sudo pkill -9 XProtect >/dev/null || true;
        echo "Waiting..."; counter=0; while pgrep XProtect && ((counter < 20)); do sleep 3; ((counter++)); done
        pgrep XProtect || true

    - name: Pack
      id: cpack
      if: ${{ matrix.pack == 1 }}
      run: |
        cd "${{github.workspace}}/out/build/${{matrix.preset}}"
        # macOS may fail due to hdiutil error, see https://github.com/actions/runner-images/issues/7522
        maxCounter=${{ startsWith(matrix.platform, 'mac-') && '10' || '0' }}
        counter=1
        until cpack -C ${{matrix.pack_type}} || ((counter > $maxCounter)); do
          sleep 3; ((counter++))
        done

    - name: Find Android package
      if: ${{ startsWith(matrix.platform, 'android') }}
      run: |
        OUTPUT_DIRECTORY="${{ github.workspace }}/out/build/${{ matrix.preset }}/android-build/vcmi-app/build/outputs"
        mv "$OUTPUT_DIRECTORY/apk/release/vcmi-release.apk" "${{github.workspace}}/out/build/${{matrix.preset}}/${{ env.VCMI_PACKAGE_FILE_NAME }}.apk"
        mv "$OUTPUT_DIRECTORY/bundle/release/vcmi-release.aab" "${{github.workspace}}/out/build/${{matrix.preset}}/${{ env.VCMI_PACKAGE_FILE_NAME }}.aab"

    - name: Keep downloadable package in GitHub Actions
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: |
          ${{github.workspace}}/out/build/${{matrix.preset}}/${{ env.VCMI_PACKAGE_FILE_NAME }}.${{ matrix.extension }}

  test:
    name: Build+Test (${{ matrix.platform }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: gcc-latest-release
            os: ubuntu-26.04
            before_install: linux_qt6.sh
            compiler_cxx: g++-15
            compiler_cc: gcc-15
            preset: linux-gcc-test

          - platform: clang-latest-debug
            os: ubuntu-26.04
            before_install: linux_qt6.sh
            compiler_cxx: clang++-22
            compiler_cc: clang-22
            preset: linux-clang-debug

          - platform: gcc-oldest-debug
            os: ubuntu-22.04
            before_install: linux_qt5.sh
            compiler_cxx: g++-10
            compiler_cc: gcc-10
            preset: linux-gcc-debug

          - platform: clang-oldest-release
            os: ubuntu-24.04
            before_install: linux_qt5.sh
            compiler_cxx: clang++-16
            compiler_cc: clang-16
            preset: linux-clang-test

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Prepare APT staging dir
      if: contains(matrix.os, 'ubuntu')
      run: mkdir -p "$RUNNER_TEMP/apt-cache"

    - name: APT cache restore
      if: contains(matrix.os, 'ubuntu')
      id: aptcache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/apt-cache
        key: ${{ matrix.platform }}-apt-${{ matrix.os }}
        restore-keys: |
          ${{ matrix.platform }}-apt-${{ matrix.os }}

    - name: Prepare CI
      run: source '${{ github.workspace }}/CI/before_install/${{ matrix.before_install }}'

    - name: Prepare Heroes 3 data
      run: |
        data_url="https://github.com/vcmi-mods/vcmi-test-data/releases/download/v2.0/heroes3.7z"
        wget --progress=dot:giga "$data_url" -O heroes3.7z
        mkdir -p ~/.local/share/vcmi/
        7za x -o"$HOME/.local/share/vcmi/" heroes3.7z

    - name: Configure
      run: |
        cmake -DENABLE_CCACHE:BOOL=ON -DCMAKE_C_COMPILER=${{ matrix.compiler_cc }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler_cxx }} --preset ${{ matrix.preset }}

    - name: Build
      run: |
        cmake --build --preset ${{matrix.preset}}

    - name: Test
      run: |
        ctest --preset ${{matrix.preset}}

    - name: Validate library startup
      run: |
        cd "${{github.workspace}}/out/build/${{matrix.preset}}/bin"
        ./vcmiserver --dummy-run 2> >(tee error.log)
        if [ ! -s error.log ]; then
            echo "Validation OK!"
            exit 0
        else
            echo "Validation failed!"
            exit 1
        fi

  windows-installer:
    needs: build
    if: ${{ needs.build.result == 'success' && (inputs.platform == 'all' || inputs.platform == 'windows') }}
    name: Create Windows Installer (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - platform: msvc-x64
            arch: x64
            os: windows-2025
            update_platform: windows-x64

          - platform: msvc-x86
            arch: x86
            os: windows-2025
            update_platform: windows-x86

          - platform: msvc-arm64
            arch: arm64
            os: windows-11-arm
            update_platform: windows-arm64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Extract version info
      id: extract-version
      run: |
        filePath="${GITHUB_WORKSPACE}/cmake_modules/VersionDefinition.cmake"

        major=$(grep -m 1 "VCMI_VERSION_MAJOR" "$filePath" | tr -d -c 0-9)
        minor=$(grep -m 1 "VCMI_VERSION_MINOR" "$filePath" | tr -d -c 0-9)
        patch=$(grep -m 1 "VCMI_VERSION_PATCH" "$filePath" | tr -d -c 0-9)

        short_version="${major}.${minor}.${patch}"
        version_timestamp=$(date +"%Y%m%d%H%M%S")

        echo "short_version=${short_version}" >> "$GITHUB_OUTPUT"
        echo "version_timestamp=${version_timestamp}" >> "$GITHUB_OUTPUT"

    - name: Download UCRT
      run: source '${{github.workspace}}/CI/wininstaller/download_ucrt.sh' '${{matrix.platform}}'

    - name: Build Number
      run: |
        source '${{github.workspace}}/CI/get_package_name.sh'
        VCMI_PACKAGE_FILE_NAME+="-${{ matrix.arch }}"
        echo VCMI_PACKAGE_FILE_NAME="$VCMI_PACKAGE_FILE_NAME" >> $GITHUB_ENV
        echo VCMI_PACKAGE_BUILD="$VCMI_PACKAGE_BUILD" >> $GITHUB_ENV
        echo VCMI_PACKAGE_NAME_SUFFIX="$VCMI_PACKAGE_NAME_SUFFIX" >> $GITHUB_ENV
        echo VCMI_PACKAGE_GOLDMASTER="$VCMI_PACKAGE_GOLDMASTER" >> $GITHUB_ENV
      env:
        PULL_REQUEST: ${{ github.event.pull_request.number }}

    - name: Download Artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.VCMI_PACKAGE_FILE_NAME }}.zip
        path: ${{github.workspace}}/artifact

    - name: Ensure Inno Setup is installed
      run: |
        if [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] && [ ! -f "/c/ProgramData/Chocolatey/bin/ISCC.exe" ]; then
          choco install innosetup --no-progress -y
        fi

    - name: Build VCMI Installer
      run: >
        CI\wininstaller\build_installer.cmd
        "${{ steps.extract-version.outputs.short_version }}"
        "${{ env.VCMI_PACKAGE_BUILD }}"
        "${{ matrix.arch }}"
        "VCMI ${{ env.VCMI_PACKAGE_NAME_SUFFIX }}"
        "${{ env.VCMI_PACKAGE_FILE_NAME }}"
        "${{ github.workspace }}\artifact"
        "${{ github.workspace }}\ucrt"
      shell: cmd

    - name: Keep Windows installer in GitHub Actions
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: |
          ${{ github.workspace }}/CI/wininstaller/Output/*.exe

  validate-code:
    name: Validate Code
    if: always()
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
        - uses: actions/checkout@v7
        - name: Ensure LF line endings
          run: |
            find . -path ./.git -prune -o -path ./AI/FuzzyLite -prune -o -path ./test/googletest \
            -o -path ./osx  -prune -o -type f \
            -not -name '*.png' -and -not -name '*.ttf' -and -not -name '*.wav' -and -not -name '*.webm' -and -not -name '*.ico' -and -not -name '*.bat' -and -not -name '*.cmd' -and -not -name '*.iss' -and -not -name '*.isl' -print0 | \
            { ! xargs -0 grep -l -z -P '\r\n'; }

        - name: Validate JSON
          run: |
            sudo apt install python3-jstyleson
            python3 CI/validate_json.py

        - name: Validate relative local includes
          run: |
            python3 CI/normalize_relative_includes.py --repo .

        - name: Validate Markdown
          uses: DavidAnson/markdownlint-cli2-action@v24.2.0
          with:
            config: 'CI/example.markdownlint-cli2.jsonc'
            globs: '**/*.md'

